name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          LDFLAGS="-s -w -X github.com/rursache/always-green-cli/internal/cli.version=${VERSION}"
          mkdir -p dist
          for pair in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            out="dist/always-green-cli-${os}-${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$LDFLAGS" -o "$out" ./cmd/always-green-cli
          done
          (cd dist && shasum -a 256 always-green-cli-* > checksums.txt)
          ls -la dist

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/always-green-cli-darwin-arm64
            dist/always-green-cli-darwin-amd64
            dist/always-green-cli-linux-amd64
            dist/always-green-cli-linux-arm64
            dist/checksums.txt

      - name: Trigger Homebrew tap update
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.TAP_GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'rursache',
              repo: 'homebrew-tap',
              workflow_id: 'update-formula.yml',
              ref: 'master',
              inputs: {
                formula: 'always-green-cli',
                tag: '${{ steps.meta.outputs.tag }}',
                repository: context.repo.owner + '/' + context.repo.repo
              }
            })
